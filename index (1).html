<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roast Toast Coast Cafe</title>
    <style>
        @font-face {
            font-family: 'Bogart';
            src: url('https://fonts.cdnfonts.com/s/24702/Bogart-Light.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: black;
            font-family: 'Bogart', sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .image-container {
            background-image: url('https://images.unsplash.com/photo-1514066558159-fc8c737ef259?q=80&w=2574&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8MHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            min-height: 300px;
        }
        .header-container {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            width: 90%;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
            text-align: center;
            background: wheat;
        }
        header h1 {
            color: #FFCC00;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
            line-height: 1.2;
        }
        header p {
            font-size: 1.3em;
            color: #FFFFFF;
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }
        .menu-section {
            background-color: #000000;
            color: #FFFFFF;
            padding: 10px;
            margin: 20px 0 20px 10%;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(189, 180, 180, 0.7);
            text-align: center;
        }
        .menu-section h2 {
            color: #FFCC00;
            font-size: 2em;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .menu-items {
            list-style-type: none;
            padding: 0;
            display: none;
        }
        .menu-items li {
            background-color: #222222;
            color: #F7F7F7;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            font-size: 1.1em;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .menu-toggle:hover {
            color: #FF9933;
            cursor: pointer;
        }
        .info-section {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            margin: 0 0 20px 10%;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(189, 180, 180, 0.7);
            text-align: center;
        }
        .info-section h2 {
            color: #FFCC00;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .info-section p {
            margin: 5px 0;
            font-size: 1em;
        }
        .book-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #FFCC00;
            color: #000000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
        .book-btn:hover {
            background-color: #FF9933;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }
            .image-container {
                min-height: 200px;
                order: -1;
            }
            .menu-section,
            .info-section {
                width: 90%;
                margin-left: 5%;
                margin-right: 5%;
            }
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header-container">
            <header>
                <h1>Welcome to the<br>Roast Toast Coast Cafe!</h1>
                <p>Where flavor meets the shore!</p>
            </header>
        </div>
        <section class="menu-section">
            <h2 class="menu-toggle" onclick="toggleMenuItems()">Our Menu</h2>
            <ul class="menu-items">
                <li>Breezy Brews</li>
                <li>Toasty Delights</li>
                <li>Coastal Bites</li>
                <li>Sunset Sips</li>
            </ul>
        </section>
        <section class="info-section">
            <h2>Visit Us</h2>
            <p>Open Daily: 7:00 AM &ndash; 6:00 PM</p>
            <p>123 Shoreline Ave, Coastal Town</p>
            <p>Phone: (555) 123-4567</p>
            <a class="book-btn" href="mailto:hello@roasttoastcoast.example?subject=Table%20Booking">Book a Table</a>
        </section>
    </div>
    <div class="image-container"></div>
    <script>
        function toggleMenuItems() {
            const menuItems = document.querySelector('.menu-items');
            menuItems.style.display = menuItems.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
